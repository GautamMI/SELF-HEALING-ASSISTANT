# ---------------------------------------------------------------------------
# Runs both applications together.
#
#   cp .env.example .env && docker compose up --build
#
# The agent needs the repository (including .git) mounted read-write so it can
# patch files, create a branch and push. Both containers share the log file
# through the `error-logs` volume.
# ---------------------------------------------------------------------------
services:
  buggy-backend:
    build:
      context: .
      dockerfile: docker/buggy-backend.Dockerfile
    container_name: buggy-backend
    environment:
      NODE_ENV: development
      PORT: 4000
      LOG_DIR: /var/log/buggy-backend
      LOG_PRETTY: "true"
      PRICING_API_URL: http://localhost:4000/internal/pricing-feed
    ports:
      - "4000:4000"
    volumes:
      - error-logs:/var/log/buggy-backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  self-healing-agent:
    build:
      context: .
      dockerfile: docker/self-healing-agent.Dockerfile
    container_name: self-healing-agent
    depends_on:
      buggy-backend:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: development
      REPO_ROOT: /workspace
      TARGET_APP_DIR: /workspace/apps/buggy-backend
      WATCH_LOG_FILE: /var/log/buggy-backend/error.log
      # Bind mounts do not emit reliable inotify events on every host.
      WATCH_USE_POLLING: "true"
      WATCH_POLL_INTERVAL_MS: "500"
      ALLOWED_PATH_PREFIXES: apps/buggy-backend/src
    volumes:
      - error-logs:/var/log/buggy-backend
      # The repository itself - the agent edits and commits inside it.
      - .:/workspace
      - /workspace/node_modules
    working_dir: /workspace/apps/self-healing-agent

volumes:
  error-logs:
